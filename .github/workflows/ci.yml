name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Go ${{ matrix.go-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.26.0"
          - "1.26.x"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - name: Report Go version
        run: go version
      - name: Run canonical validation
        run: make check

  traceability:
    name: Traceability and conformance smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out implementation history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check out pinned public reference source and specification history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: tv-rain/barometer-spec
          ref: f889a381c84a781176024f3fed3a3d4f5c92b241
          path: .ci/public-spec
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.0"
          cache: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install pinned checker dependencies
        run: python -m pip install -r .ci/public-spec/scripts/requirements.txt
      - name: Run canonical traceability checks
        run: make traceability PYTHON=python SPEC_CHECKOUT=.ci/public-spec REPORT_DIR="${{ runner.temp }}/traceability-reports"
      - name: Preserve reports including unresolved gaps
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: traceability-reports
          path: ${{ runner.temp }}/traceability-reports/
          if-no-files-found: error
          retention-days: 14
